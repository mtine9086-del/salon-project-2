name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean site directory
        run: mkdir -p _site

      - name: Extract Curly & Wavy image assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = [
              "curly-wavy-web-project-cleaned (1).zip",
              "curly-wavy-8-images-cleaned.zip",
          ]
          output = Path("_site/images/curly-wavy")
          output.mkdir(parents=True, exist_ok=True)
          extracted = set()
          for archive in archives:
              path = Path(archive)
              if not path.exists():
                  continue
              with ZipFile(path) as z:
                  for member in z.namelist():
                      parts = member.replace("\\", "/").split("/")
                      if member.lower().endswith(".webp") and "curly-wavy" in parts:
                          name = parts[-1]
                          if name not in extracted:
                              (output / name).write_bytes(z.read(member))
                              extracted.add(name)
          print(f"Extracted {len(extracted)} Curly & Wavy WebP assets.")
          PY

      - name: Extract beard and moustache catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("beard-moustache-catalogue-upload-ready.zip")
          if not archive.exists():
              raise SystemExit("Required beard catalogue archive is missing.")
          count = 0
          with ZipFile(archive) as z:
              for member in z.namelist():
                  parts = member.replace("\\", "/").split("/")
                  if member.lower().endswith(".webp") and len(parts) >= 3:
                      folder = parts[-2]
                      filename = parts[-1]
                      if folder in {"01_Beard_Portraits", "02_Traditional_Turban_Beard", "03_Moustache_Focused"}:
                          target = Path("_site/images/beard-moustache") / folder / filename
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(z.read(member))
                          count += 1
          if count != 42:
              raise SystemExit(f"Expected 42 beard images, extracted {count}.")
          print(f"Extracted {count} beard and moustache WebP assets.")
          PY

      - name: Copy website files only
        run: |
          cp index.html style.css script.js _site/
          find . -maxdepth 1 -type f -name '*.webp' -exec cp {} _site/ \;
          if [ -d images ]; then cp -R images/. _site/images/; fi
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/script.js
          if find _site -type f \( -name '*.zip' -o -name '*.ps1' -o -name '*.md' \) | grep -q .; then
            echo "Unexpected source/development files found in public artifact."
            exit 1
          fi
          echo "Clean website artifact prepared."

      - name: Publish all 41 newly uploaded reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, html

          archive = Path("salon-images-upload-ready.zip")
          if not archive.exists():
              raise SystemExit("salon-images-upload-ready.zip is missing")
          output = Path("_site/images/uploaded-41")
          output.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive) as z:
              manifest = json.loads(z.read("image-manifest.json"))
              entries = [e for e in manifest if e.get("output_file", "").lower().endswith(".webp")]
              if len(entries) != 41:
                  raise SystemExit(f"Expected 41 WebP images in upload package; found {len(entries)}")
              cards = {"hair": [], "beard": []}
              for entry in entries:
                  source = entry["output_file"]
                  filename = Path(source).name
                  target = output / filename
                  target.write_bytes(z.read(source))
                  label = entry.get("visual_label", Path(filename).stem.replace("-", " ")).replace("_", " ")
                  label = html.escape(label)
                  src = "images/uploaded-41/" + filename
                  is_beard = filename.startswith("beard-")
                  category = "beard" if is_beard else "texture"
                  cls = "style-card beard-card" if is_beard else "style-card"
                  desc = "Beard and moustache grooming reference" if is_beard else "Haircut and hairstyle reference"
                  card = (f'<article class="{cls}" data-name="{label}" data-category="{category}">'
                          f'<button class="style-image" type="button" data-src="{src}" aria-label="View {label}">'
                          f'<img src="{src}" alt="{label} — {desc}" loading="lazy" decoding="async">'
                          f'<span class="image-open">VIEW <b>↗</b></span></button>'
                          f'<div class="style-info"><div><h4>{label}</h4><p>{desc}</p></div><span>↗</span></div></article>')
                  cards["beard" if is_beard else "hair"].append(card)

          index = Path("_site/index.html")
          page = index.read_text(encoding="utf-8")
          hair_marker = '<p id="no-results"'
          beard_marker = '</div></section>'
          if hair_marker not in page or 'id="hair-grid"' not in page or 'id="beard-grid"' not in page:
              raise SystemExit("Could not locate gallery grids in index.html")
          # Insert uploaded hairstyle cards before the closing tag of #hair-grid.
          hair_pos = page.index(hair_marker)
          hair_grid_close = page.rfind("</div>", 0, hair_pos)
          if hair_grid_close < page.index('id="hair-grid"'):
              raise SystemExit("Could not locate closing tag for #hair-grid")
          page = page[:hair_grid_close] + "\\n" + "\\n".join(cards["hair"]) + "\\n" + page[hair_grid_close:]
          beard_start = page.index('id="beard-grid"')
          beard_end = page.index(beard_marker, beard_start)
          page = page[:beard_end] + "\\n" + "\\n".join(cards["beard"]) + page[beard_end:]
          index.write_text(page, encoding="utf-8")
          print(f'Published {len(entries)} images: {len(cards["hair"])} hairstyle/editorial and {len(cards["beard"])} beard references.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
