name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract hairstyle image archives
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          archives = [
              "curly-wavy-web-project-cleaned (1).zip",
              "curly-wavy-8-images-cleaned.zip",
          ]
          for archive in archives:
              with ZipFile(archive) as z:
                  for member in z.namelist():
                      if member.startswith("images/curly-wavy/") and not member.endswith("/"):
                          z.extract(member, ".")
          print("Extracted curated Curly & Wavy image assets.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
